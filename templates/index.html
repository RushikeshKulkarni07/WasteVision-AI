<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Classifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div>
                <p class="eyebrow">AI Waste Sorting</p>
                <h1>Waste Classifier</h1>
            </div>
            <span class="badge">CNN Model</span>
        </header>

        <main class="layout">
            <section class="panel upload-panel">
                <h2>Upload Waste Image</h2>
                <form id="uploadForm" enctype="multipart/form-data">
                    <label for="imageInput" class="upload-box">
                        <input id="imageInput" type="file" name="image" accept="image/*" required>
                        <span id="fileLabel">Choose an image or drag it here</span>
                    </label>
                    <button type="submit" class="primary-btn">Classify Waste</button>
                </form>

                <div id="resultCard" class="result-card hidden">
                    <img id="resultImage" alt="Uploaded waste preview">
                    <div class="result-text">
                        <p class="result-label">Prediction</p>
                        <h3 id="predictedClass">-</h3>
                        <p id="confidenceText">Confidence: -</p>
                    </div>
                </div>

                <div id="messageBox" class="message-box hidden"></div>
            </section>

            <aside class="panel history-panel">
                <h2>Recent Predictions</h2>
                <div id="historyList" class="history-list"></div>
            </aside>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
